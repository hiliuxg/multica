map $http_upgrade $multica_connection_upgrade {
    default upgrade;
    ''      close;
}

# The public reverse proxy terminates TLS and forwards its original scheme.
# Fall back to the scheme seen by this gateway for same-host HTTP testing, and
# accept only the two schemes the backend understands.
map $http_x_forwarded_proto $multica_forwarded_proto {
    default $scheme;
    http    http;
    https   https;
}

server {
    listen 80 default_server;
    server_name _;

    # Multica accepts files up to 100 MiB. Leave enough room for multipart
    # framing so nginx never becomes the smaller, surprising limit.
    client_max_body_size 110m;

    # This callback is a Next.js page. Keep it ahead of the /auth/* API route
    # so the backend's enterprise-login redirect can finish the cookie bootstrap.
    location = /auth/hg-sso/callback {
        proxy_pass http://frontend:3000;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $multica_forwarded_proto;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        proxy_connect_timeout 10s;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # API, authentication, uploads, and both browser/daemon WebSockets go
    # directly to the backend. Everything else is the Next.js Web app.
    location ~ ^/(?:health(?:/.*)?|healthz|readyz|api(?:/.*)?|v1(?:/.*)?|auth(?:/.*)?|ws(?:/.*)?|uploads(?:/.*)?)$ {
        proxy_pass http://backend:8080;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $multica_forwarded_proto;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $multica_connection_upgrade;

        proxy_connect_timeout 10s;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }

    location / {
        proxy_pass http://frontend:3000;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $multica_forwarded_proto;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        proxy_connect_timeout 10s;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}
